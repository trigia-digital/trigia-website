<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#17171A"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#FF8A50"/>
    </linearGradient>
    <radialGradient id="ember3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>
  <circle cx="620" cy="140" r="220" fill="url(#ember3)"/>

  <!-- baseline -->
  <line x1="100" y1="400" x2="700" y2="400" stroke="#33333A" stroke-width="1.5"/>

  <!-- three ascending bars: Starter / Growth / Full System -->
  <g>
    <rect x="150" y="330" width="110" height="70" rx="8" fill="#2A2A30" stroke="#3D3D45"/>
    <text x="205" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A8A93">Template</text>

    <rect x="330" y="270" width="110" height="130" rx="8" fill="#2A2A30" stroke="#FF5A1F" stroke-width="1.5"/>
    <text x="385" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#C4C4CC">Custom</text>

    <rect x="510" y="180" width="120" height="220" rx="8" fill="url(#barGrad)"/>
    <text x="570" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F4F4F5" font-weight="bold">Agency</text>
  </g>

  <!-- rupiah coin icon top-left -->
  <g transform="translate(140,110)">
    <circle r="42" fill="#1F1F23" stroke="#FF5A1F" stroke-width="2.5"/>
    <text x="0" y="12" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#FF8A50" font-weight="bold">Rp</text>
  </g>

  <!-- floating small coins -->
  <circle cx="80" cy="220" r="14" fill="#1F1F23" stroke="#FF5A1F" stroke-width="1.5"/>
  <circle cx="240" cy="90" r="10" fill="#1F1F23" stroke="#FF5A1F" stroke-width="1.5"/>

  <!-- magnifying glass over the tallest bar, "cek harga jujur" concept -->
  <g transform="translate(645,140)">
    <circle r="28" fill="none" stroke="#F4F4F5" stroke-width="4"/>
    <line x1="20" y1="20" x2="40" y2="40" stroke="#F4F4F5" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
