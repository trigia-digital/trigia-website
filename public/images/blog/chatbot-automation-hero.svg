<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0D"/>
      <stop offset="100%" stop-color="#17171A"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#FF8A50"/>
    </linearGradient>
    <radialGradient id="ember1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5A1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad1)"/>
  <circle cx="580" cy="160" r="220" fill="url(#ember1)"/>

  <!-- manual chat bubble: dark, waiting, typing dots -->
  <g transform="translate(150,190)">
    <path d="M0 28 Q0 0 28 0 H160 Q188 0 188 28 V88 Q188 116 160 116 H50 L14 148 L20 116 H28 Q0 116 0 88 Z"
          fill="#2A2A30" stroke="#3D3D45" stroke-width="1.5"/>
    <circle cx="55" cy="58" r="7" fill="#6A6A72"/>
    <circle cx="90" cy="58" r="7" fill="#6A6A72"/>
    <circle cx="125" cy="58" r="7" fill="#6A6A72"/>
  </g>
  <text x="244" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8A8A93">Manual</text>

  <!-- flow arrow -->
  <path d="M400 250 H470" stroke="#FF5A1F" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M462 242 L478 250 L462 258" fill="none" stroke="#FF5A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- automated chat bubble: glowing orange, lightning bolt = automation -->
  <g transform="translate(510,150)">
    <path d="M0 32 Q0 0 32 0 H190 Q222 0 222 32 V104 Q222 136 190 136 H60 L18 172 L26 136 H32 Q0 136 0 104 Z"
          fill="url(#bubbleGrad)"/>
    <path d="M118 30 L88 78 H112 L100 118 L142 66 H116 Z" fill="#0B0B0D"/>
  </g>
  <text x="620" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F4F4F5" font-weight="bold">Otomatis</text>

  <!-- clock badge, top-left, echoing the "Rp" coin badge composition -->
  <g transform="translate(120,110)">
    <circle r="42" fill="#1F1F23" stroke="#FF5A1F" stroke-width="2.5"/>
    <circle r="24" fill="none" stroke="#FF8A50" stroke-width="2.5"/>
    <line x1="0" y1="0" x2="0" y2="-14" stroke="#FF8A50" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="9" y2="6" stroke="#FF8A50" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- floating small dots (individual messages) -->
  <circle cx="670" cy="90" r="10" fill="#1F1F23" stroke="#FF5A1F" stroke-width="1.5"/>
  <circle cx="90" cy="260" r="14" fill="#1F1F23" stroke="#FF5A1F" stroke-width="1.5"/>
  <circle cx="440" cy="120" r="8" fill="#1F1F23" stroke="#FF5A1F" stroke-width="1.5"/>
</svg>
